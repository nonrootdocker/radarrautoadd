[package]
name = "radarr-auto-add-people"
version = "0.1.0"
edition = "2021"
description = "Add movies to Radarr automatically based on the people who worked on them"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
env_logger = "0.11"
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "http2", "charset", "rustls", "rustls-native-certs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slug = "0.1"
toml = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
